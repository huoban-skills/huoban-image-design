<!--
伙伴云界面示意图 · 结构 5：数据大屏

来源：2026-09-14 app.huoban.com 实测官方「数据大屏」样板文件夹的六张页面（深青未来、青色自然、蓝色科技、
   红色党建、黑金金融、黑金金融(1)），工作区 Project Management。六页版式同构，组件构成与栏高见下。
   大屏＝自定义页面「超宽」模式（page_width=ultra）＋深色文字模式＋整页背景图＋卡片装饰框，
   组件仍是工作台那套（单指标、面积图、饼图、进度条、双轴图、折线图、表格列表、富文本标题、时间、装饰）。
   实测：页面不缩放（transform none、zoom 1），24 栅格、间距 20、行高公式 20h−20，与其他页面完全一致。
   官方的背景、标题铭牌、四角角标全是上传的 PNG（border-image），CSS 里没有任何发光、滤镜或专用字体；
   本 skill 不带这些图，用纯 CSS 画等价几何（base.css「数据大屏」一节）。

本文件是架构与组件目录，不含业务示例：
1. .screen 是画布，宽随 .stage（1640），内距 20；唯一的子节点是 .screen-grid（24 栅格，列跨度 sp-N、行跨度 rs-N）。
2. 骨架固定：标题行 24×5（logo 3 ＋ 大标题 18 ＋ 时间 3）→ 分隔条 24×2 → 主体三列 6 ｜ 12 ｜ 6（各 38 行）
   → 底部 12＋12（各 26 行）。左列 = 指标框 ×2（各 3×6）→ 面积图 6×16 → 饼图 6×16；右列 = 进度条 6×12 → 对比图 6×26。
   变体：三列压成 5 ｜ 14 ｜ 5 并去掉指标框（深青未来）；顶部整块换成页签容器当标题容器（红色党建、青色自然）。
3. 主题五选一挂在 .screen 上：theme-cyan 深青未来（默认）/ theme-blue 蓝色科技 / theme-gold 黑金金融 /
   theme-red 红色党建 / theme-light 青色自然（浅色）。每套只改 token（底色、描边、角标色、光带色、文字明暗），结构尺寸共用。
4. 背景＝主题底色 ＋ 细网格纹理 ＋ 顶部光带，都在 CSS 里；bg-earth / bg-city / bg-grid / bg-gold 是可选的装饰底图，默认不用。
5. 卡片一种样式：直角（浅色主题圆角 9）、半透明底、1px 描边、四角 L 形角标；标题条 40 高，左侧斜切铭牌 ＋ 右侧渐弱斜纹。
6. 图表系列色五个主题相同：主色 #5DA8E9、次色 #B6C7D5，饼图六档灰蓝，进度条蓝/橙/绿/红轮转，写成 --screen-* token。
7. 放进 .screen 的既有组件（表格列表、透视表、图表 SVG）自动走大屏 token，不用改类名。
8. 大屏不套产品壳（.window／左侧导航／顶栏）——官方是在应用壳里渲染的，但出图交付的是投屏画面，只给画布。
-->

          data-measured="实测视口 1574×891、栅格容器 1271，列宽 =(容器宽−460)/24，组件高 =20h−20，间距 20，不缩放；skill 画布 1640 宽，官方骨架排下来 1440 高；六页 page_width 均为 ultra，自动刷新 5 分钟（2026-09-14）">
  <div class="stage">

        <!-- 组件：左列 .screen-col sp-6 rs-38（指标框 rs-6 → 面积图 rs-16 → 饼图 rs-16） -->
        <!-- 组件：中央视觉位 sp-12 rs-38 -->
        <!-- 组件：右列 .screen-col sp-6 rs-38（进度条 rs-12 → 对比图 rs-26） -->
        <!-- 组件：底部 折线图 sp-12 rs-26 ＋ 表格列表 sp-12 rs-26 -->
      </div>
    </div>
  </div>
</template>
