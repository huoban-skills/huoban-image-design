<!--
伙伴云界面示意图 · 结构 3/3：详情与自定义页面架构、组件名称

本文件是组件目录，不是整页示例：
1. 每个 <template> 独立，出现顺序不代表页面默认顺序。
2. 只选需求需要的架构和组件，不整段复制。
3. 不含业务示例、示例数据和默认文案；具体字段结构按需读取 c2-table-form.html。
4. 尺寸、颜色和交互外观由 base.css 与 skins/*.css 提供。
-->

<!-- ══════════ 十四、独立自定义详情页架构（2026-08-07 伙伴云真实页面实测） ══════════
结构边界：
1. 自定义详情页默认是一张独立内容画布，不复用产品壳，也不包在记录详情弹窗中。
2. 独立详情页不出现一级顶栏、左侧导航、记录操作栏、弹窗遮罩、弹窗标题栏或底部栏。
3. 页面内容使用 24 栅格：画布上边距 48、左右内缩 96、组件间距 20；双栏可按 8/24＋16/24 组合。
4. 标题卡片、选项字段步骤样式、页签容器都是真实组件；“详情侧栏卡/详情主内容卡/归档页签卡”只是布局角色，不是组件名称。
5. 标题卡片只承载摘要信息，不放按钮；独立自定义详情页本身不设置系统操作栏。
-->
<template data-architecture="独立自定义详情页" data-default-for="详情页" data-source="伙伴云真实自定义详情页">
  <main class="custom-detail-page">
    <!-- 组件：记录功能区（默认包含，2026-08-10 实测确认：自定义详情页自带此栏，无论弹窗或独立形态） -->
    <div class="item-page-canvas">
      <div class="item-page-grid">
        <!-- 可选组件：标题卡片，占宽 24 -->
        <!-- 可选组件：选项字段-步骤样式，占宽 24 -->
        <!-- 常见布局：页签容器占宽 8＋页签容器占宽 16；这是栅格组合，不是专用侧栏/主卡组件 -->
        <!-- 可选组件：页签容器，占宽 24；页签内可放表格列表、字段、统计、流程等已收录组件 -->
      </div>
    </div>
  </main>
</template>

<template data-component="记录功能区" data-group="自定义详情页" data-use="自定义详情页默认包含（弹窗与独立形态皆有，实测确认）" data-measured="高 56、白底、下边线 1px rgba(0,0,0,.08)、左右内边距 16；标题 16/500；快捷按钮高 32 圆角 6，实底／彩色线框／置灰三态并存（实测同一页同时出现绿实底、红线框、灰置灰）；右侧系统操作：编辑、复制、分享、打印、历史、更多、关闭">
  <div class="item-page-toolbar">

    <div class="item-page-record-title"><!-- 记录主标题 --> <span class="caret">▾</span></div>

<template data-component="流程页签" data-group="记录详情"
          data-use="带流程的记录详情右栏（记录详情弹窗 modal-side，或独立自定义详情页的配套流程展示区）：替代 动态feed＋评论框 整段；页签顺序固定 流程/动态/评论、流程在前"
          data-measured="2026-08-20 app.huoban.com 真实 DOM 实测（hb-flow-message / hb-flowbox-timeline / hb-flowbox）：页签行 流程/动态/评论；头部白块＝圆形应用图标32＋流程名13/500＋发起人·时间12/ink-45＋居中「撤销流程」行32；timeline 浅灰底 pad16、节点卡倒序（白卡 r6、1px rgba(0,0,0,.04) 边、卡间12）；卡＝head32（thumb24 r6＋节点名12/500）＋状态行12（执行中橙/同意绿/驳回红）＋时间行12灰（日期＋⏱耗时）＋可选「催办」links 行；面板底部「查看详细记录」32 居中">
  <div class="flow-msg">
    <div class="flow-msg-body">
      <span class="app-ic"><svg class="ico"><use href="#i-grid-s"/></svg></span>
      <span><b><!-- 流程名称 --></b><small><!-- 发起人 · 发起时间 --></small></span>
    </div>
    <div class="flow-msg-actions">撤销流程</div>
  </div>
  <div class="flowbox-timeline">
    <div class="flowbox">
      <div class="flowbox-head"><span class="n-ic"><svg class="ico"><use href="#i-f-user"/></svg></span><strong><!-- 节点名称 --></strong></div>
      <div class="flowbox-body">
        <div class="st"><!-- 执行人＋状态；同意加 .green、驳回加 .red、未开始加 .gray；启动事件用 .txt --></div>
        <div class="tm"><span><!-- 日期 --></span><span><svg class="ico"><use href="#i-history"/></svg> <!-- 耗时 --></span></div>
      </div>
      <div class="flowbox-links">催办</div> <!-- 仅当前待办节点有 -->
    </div>
  </div>
  <div class="flow-foot">查看详细记录</div>
</template>
