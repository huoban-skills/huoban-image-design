伙伴云界面示意图 · 结构 3/3：详情与自定义页面架构、组件名称

本文件是组件目录，不是整页示例：
1. 每个 <template> 独立，出现顺序不代表页面默认顺序。
2. 只选需求需要的架构和组件，不整段复制。
3. 不含业务示例、示例数据和默认文案；具体字段结构按需读取 c2-table-form.html。
4. 尺寸、颜色和交互外观由 base.css 与 skins/*.css 提供。
-->

<!-- ══════════ 十三、独立自定义详情页架构（2026-08-07 伙伴云真实页面实测） ══════════
结构边界：
1. 自定义详情页默认是一张独立内容画布，不复用产品壳，也不包在记录详情弹窗中。
2. 独立详情页不出现一级顶栏、左侧导航、弹窗遮罩、弹窗标题栏或底部栏；顶部记录功能区默认包含（2026-08-10 复测）。
3. 页面内容使用 24 栅格：画布上边距 48、左右内缩 96、组件间距 20；双栏可按 8/24＋16/24 组合。
4. 页头卡片、选项字段步骤样式、标签页都是真实组件；“详情侧栏卡/详情主内容卡/归档页签卡”只是布局角色，不是组件名称。
5. 页头卡片只承载摘要信息，不放按钮；按钮放记录功能区。
-->

    <div class="item-page-canvas">
      <div class="item-grid">
        <!-- 可选组件：页头卡片，占宽 24 -->
        <!-- 可选组件：选项字段-步骤样式，占宽 24 -->
        <!-- 常见布局：标签页占宽 8＋标签页占宽 16；这是栅格组合，不是专用侧栏/主卡组件 -->
        <!-- 可选组件：标签页，占宽 24；页签内可放表格列表、字段、统计、流程等已收录组件 -->

    </div>
