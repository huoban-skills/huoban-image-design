<!--
伙伴云界面示意图 · 结构 1/3：画布与产品壳层

本文件是架构与组件目录，不含业务示例：
1. 产品设计类使用“产品界面壳层”；营销类在此基础上按需增加浮层或标注。
2. data-architecture 表示页面层级；data-component 表示可重复组件。
3. 组件槽位中的注释说明内容类型，不是默认文案。
4. 尺寸、颜色与状态外观由 base.css 和 skins/*.css 提供。
-->

<template data-architecture="产品界面壳层" data-cn="产品壳（左侧导航＋一级顶栏）"
          data-measured="左右两列、左列通顶：左侧导航 248 宽从 y=0 贯到底，顶部 56 高放工作区标志＋名称＋新建；一级顶栏只覆盖右侧内容区（56 高），内含菜单图标＋当前页面名＋右侧系统图标组。顶部这一行左右两段可以同色">
  <div class="stage">
    <!-- 主题四选一，挂在 .window 上：
         theme-band  顶部整条同色（左顶段＋右顶栏同为深色），侧栏其余白 —— 默认
         theme-side  整个左列深色，右侧顶栏白
         theme-full  整个左列深色，右侧顶栏浅一档
         theme-light 全浅：左列与顶栏都是白底 -->
    <div class="window theme-band">
      <div class="win-body">
        <!-- 组件：左侧导航（含顶部工作区块） -->
        <div class="main">
          <!-- 组件：一级顶栏 -->
          <!-- 页面内容插槽：放入 c2/c3 页面内部结构，不再嵌套第二个 .main -->
        </div>
      </div>
    </div>
  </div>
</template>

<template data-component="一级顶栏" data-cn="一级顶栏" data-group="产品壳层"
          data-measured="只覆盖右侧内容区，高 56、padding 0 12；菜单图标＋当前页面名 15/500＋展开图标；右侧系统图标组 gap 18＋头像 28">
  <div class="shell-top-bar">
    <span class="menu"><svg class="ico"><use href="#i-menu"/></svg></span>
    <span class="pg"><!-- 当前页面名称 --></span>
    <span class="caret"><!-- 展开图标 --></span>
    <div class="right"><!-- 客服、通知、工作台、帮助与头像 --></div>
  </div>
</template>

<template data-component="左侧导航" data-cn="左侧导航" data-group="产品壳层"
          data-measured="248 宽通顶；顶部 56 高工作区块（标志 32 圆形＋名称 16/500＋新建）；其下图标行 44、导航树 padding 12 8、底部条 48">
  <div class="shell-side">
    <div class="side-top">
      <span class="ws-logo"><!-- 工作区标志 --></span>
      <span class="ws-name"><!-- 工作区名称 --></span>
      <span class="plus"><svg class="ico"><use href="#i-plus"/></svg></span>
    </div>
    <div class="ico-row"><!-- 首页、表格、文档、流程入口 --></div>
    <div class="tree"><!-- 导航分组、页面项、文件夹与子项 --></div>
    <div class="bottom"><!-- 管理、成员与更多操作 --></div>
  </div>
</template>

<template data-component="导航图标入口" data-cn="导航图标入口" data-group="左侧导航">
  <i><svg class="ico"><use href="#i-home"/></svg></i> <!-- 图标页签行四项依次：home / table / doc / flow -->
</template>

<template data-component="导航分组标题" data-cn="导航分组" data-group="左侧导航">
  <div class="group"><!-- 分组名称 --></div>
</template>

<template data-component="导航页面项" data-cn="导航页面项" data-group="左侧导航">
  <div class="shell-nav-leaf">
    <span class="li"><svg class="ico"><use href="#i-app-s"/></svg></span> <!-- 表/页面的彩色应用图标，按业务选：app-s grid-s board-s chart-s trend-s pie-s check-s fire-s factory-s box-s star-s -->
    <!-- 页面名称 -->
  </div>
</template>

<template data-component="导航文件夹" data-cn="导航文件夹" data-group="左侧导航">
  <div class="shell-nav-folder">
    <span class="fi"><svg class="ico"><use href="#i-folder"/></svg></span>
    <!-- 文件夹名称 -->
    <span class="n"><!-- 子项数量 --></span>
    <span class="more"><!-- 更多操作 --></span>
  </div>
</template>

<template data-component="导航子项容器" data-cn="导航子项" data-group="左侧导航">
  <div class="sub"><!-- 导航页面项 --></div>
</template>

<template data-component="营销浮层" data-cn="营销浮层" data-group="画布" data-default="off">
  <div class="mk-float"><!-- 已收录组件 --></div>
</template>

<template data-component="营销标注" data-cn="营销标注" data-group="画布" data-default="off">
  <div class="mk-callout"><!-- 业务价值说明 --></div>
</template>
