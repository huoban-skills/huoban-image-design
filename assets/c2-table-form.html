<!--
伙伴云界面示意图 · 结构 2/3：表格页、字段、表单与业务视图

本文件是架构与组件目录，不含业务示例：
1. 每个 <template> 独立，出现顺序不代表页面默认顺序。
2. data-architecture 表示页面层级；data-component 表示组件或合法变体。
3. 注释只说明槽位语义；字段名、记录值、按钮文案和视图名称由当前需求决定。
4. 同一页面只选所需视图引擎，不整段复制业务视图库。
5. 尺寸、颜色与状态外观由 base.css 和 skins/*.css 提供。
-->

<!-- ══════════ 八之二、交互界面（快捷按钮点开的那一屏） ══════════
     2026-10-12 app.huoban.com 1455×695 视口实测，对应自动化「页面交互」节点。盖在列表页、详情页或工作台上，一张图一个。
     各节点打开什么：
       打开数据创建页／打开数据编辑页 → 创建或编辑表单（上一节），标题下可带一条提示条
       打开数据查看页 → 记录详情弹窗（c3）
       打开数据选择页（单选／多选）→ 数据选择页；打开数据批量增删改页面 → 数据批量增删改页面
       打开确认弹窗 → 确认弹窗；打开参数填写页 → 参数填写页；打开扫码器 → 扫码器；打印数据 → 打印数据；查看嵌入的网页 → 嵌入的网页
       跳转到／复制内容到剪贴板／跳转浏览器下载 → 没有自己的界面（复制成功不出提示，下载直接由浏览器开始），不画
     只采集了电脑端；手机端点开这些节点的样子未采集 -->
<template data-component="数据选择页" data-cn="数据选择页" data-group="交互界面" data-layer="overlay"
          data-measured="遮罩 rgba(34,34,34,.45)；弹窗四周各留 48（1359×599），白底圆角 6，阴影 0 0 0 1px 4% 黑＋0 20 40 8% 黑；标题栏 48 下边线，标题 16/700 居中；提示条（可选）32 高、橙 rgba(245,127,23,.08) 底圆角 6、上 8 左右 16、12 号 45% 灰带信息图标；工具栏 48 下边线：左「已选 N 条」（数字主色）＋竖线＋「只看已选」＋开关 24×16，右 筛选／排序／冻结／行高 各 72×32 ＋搜索框 180；表格同网格视图（表头 32、行 35），首列 75 宽：未勾选显示行号、勾选后显示主色勾，勾选行底 4% 黑；条数行 40（12 号 45% 灰）；分页 49 高上边线（页码 32×32、20 行/页）；底栏 49 上边线，取消 76×32（4% 黑底）、确定主色实底，间距 8 右距 16；一行未选时确定置灰。单选节点是同一个界面少三样：没有「只看已选」和开关、表头没有勾选框、没有底栏——鼠标停在行上行号变成空勾选框，点一行就选定并继续，Esc 关不掉">
  <div class="dlg-mask"></div>
  <div class="dlg wide dlg-pick">
    <div class="dlg-hd"><!-- 节点上配的标题 --></div>
    <div class="dlg-tip warn"><svg class="ico"><use href="#i-info"/></svg><!-- 提示文字（可选） --></div>
    <div class="view-tools dlg-tools"><!-- 已选 N 条｜只看已选 开关；右侧 筛选 排序 冻结 行高 搜索 --></div>
    <div class="dlg-bd"><div class="grid"><!-- table：首列 th.pick / td.pick --></div></div>
    <div class="dlg-count"><span><!-- N条 --></span></div>
    <div class="view-pager"><!-- ‹ 1 › 20 行/页 --></div>
    <div class="dlg-ft"><span class="b sec">取消</span><span class="b solid">确定</span></div>
  </div>
</template>

<template data-component="数据批量增删改页面" data-cn="数据批量增删改页面" data-group="交互界面" data-layer="overlay"
          data-measured="外框、标题栏、底栏同数据选择页，主按钮是「保存」；信息行 47 高下边线：「来自 表名 的数据」12 号 45% 灰、表名主色，竖线后「共 N 条」，右侧 24 的主色 ⊕（允许新增时）；表格首列 75 宽行号，hover 行号位变成复制、删除两个图标；表头必填列右端红星；允许新增时末尾多一行 2% 黑底的空行（带默认值的格显示半透明默认值）。节点可只开增、改、删中的几项：只改不增时没有 ⊕ 和末尾空行">
  <div class="dlg-mask"></div>
  <div class="dlg wide dlg-batch">
    <div class="dlg-hd"><!-- 节点上配的标题 --></div>
    <div class="dlg-info">来自 <em><!-- 表名 --></em> 的数据<i class="sep"></i>共 <!-- N --> 条<span class="add"><svg class="ico"><use href="#i-plus-circle"/></svg></span></div>
    <div class="dlg-bd"><div class="grid"><!-- table：首列 th.pick / td.pick 行号；末行 tr.ghost --></div></div>
    <div class="dlg-ft"><span class="b sec">取消</span><span class="b solid">保存</span></div>
  </div>
</template>
