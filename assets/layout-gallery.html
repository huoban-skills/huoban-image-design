<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>版式示意</title>
<style>
body{margin:0;padding:28px;font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#222;background:#f4f5f7}
h1{font-size:20px;margin:0 0 6px}h2{font-size:17px;margin:34px 0 12px;padding-left:10px;border-left:4px solid #2f6fed}
.wrap{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.card{background:#fff;border:1px solid #dde1e7;border-radius:8px;width:440px;padding:14px}
.card h3{margin:0 0 4px;font-size:15px}.card p{margin:0 0 10px;color:#666;font-size:12px}
.g{display:grid;grid-template-columns:repeat(24,1fr);gap:4px;align-content:start}
.b{background:#e9eef8;border:1px solid #9fb4e6;border-radius:3px;font-size:11px;color:#2c4a8f;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;box-sizing:border-box;min-height:18px}
.b.t{background:#fff3e0;border-color:#e6b070;color:#8a5200}
.b.k{background:#e6f5ec;border-color:#7fc59a;color:#1c6b3d}
.b.f{background:#f1f1f1;border-color:#bbb;color:#555}
.b.x{background:#fdeaea;border-color:#e39a9a;color:#8f2b2b}
.n{display:grid;grid-template-columns:repeat(24,1fr);gap:4px;align-content:start}
</style></head><body>
<h1>页面版式示意（24 栅格，块高按行高比例）</h1>
<p style="color:#666;margin:0">与 references/principles 各页面篇"布局原则"里的版式表一一对应，改版式表时同步改本文件的 SECTIONS 数据。橙＝横幅／标题，蓝＝指标与图表，绿＝按钮组件与待办，灰＝筛选与说明，红＝明细表。</p>
<div id="root"></div>
<script>
// 块：[span, 文字, 高px, 类]；子网格：{span, rows:[[...]]}
const H=6; // 每栅格高单位
const R=(...b)=>b;
const SECTIONS=[
{title:"数据看板（4 种）＋大屏（1 种）",items:[
 {name:"层叠式",use:"默认：一条主线讲三问，指标 4～6 个、图 2～3 张。先总后分：指标给结论，图表给原因，明细给动作。",rows:[
  R([24,"横幅 24×5",5,"t"]),R([6,"筛选",3,"f"],[6,"筛选",3,"f"],[6,"筛选",3,"f"],[6,"筛选",3,"f"]),
  R([6,"单指标",7],[6,"单指标",7],[6,"单指标",7],[6,"单指标（或多项统计）",7]),
  R([16,"主趋势图 16×20（折线／面积／柱状／双轴）",20],[8,"对比图 8×20（柱状／条形／饼／环）",20]),R([24,"底部 24×16（透视表／表格列表）",16,"x"])]},
 {name:"中心视觉式",use:"用户要的是大屏：标题行 → 分隔条 → 三列主体（左右各：指标 ×2 → 两张图或进度条 | 大屏中央视觉位）→ 底部通栏两块。三列等高、左右对称，深色底。",dark:true,rows:[
  R([3,"logo",5,"f"],[18,"大标题 18×5",5,"t"],[3,"时间 3×5",5,"f"]),R([24,"分隔条 24×2",2,"f"]),
  R({span:6,rows:[R([12,"大屏指标框 3×6",6],[12,"大屏指标框 3×6",6]),R([24,"图 6×16（面积／折线／柱状）",16]),R([24,"图 6×16（饼／环／条形）",16])]},
    [12,"大屏中央视觉位 12×38",38],
    {span:6,rows:[R([12,"大屏指标框 3×6",6],[12,"大屏指标框 3×6",6]),R([24,"进度条 6×12（进度条／柱状／饼）",12]),R([24,"对比图 6×20（柱状／条形／双轴）",20])]}),
  R([12,"趋势图 12×26（折线／面积／双轴）",26],[12,"表格列表 12×26",26,"x"])]},
 {name:"左栏导览式",use:"常驻筛选 5 个以上：横排放不下又要一直可见，收进左列，分类汇总在下当导航，右侧只放内容。",rows:[
  R([24,"横幅 24×5",5,"t"]),
  R({span:6,rows:[R([24,"筛选 6×3",3,"f"]),R([24,"筛选 6×3",3,"f"]),R([24,"筛选 6×3",3,"f"]),R([24,"筛选 6×3",3,"f"]),R([24,"筛选 6×3",3,"f"]),R([24,"分类汇总 6×20（分类汇总／进度条）",20])]},
    {span:18,rows:[R([8,"单指标 6×7",7],[8,"单指标 6×7",7],[8,"单指标 6×7",7]),R([12,"图 9×16（折线／柱状／饼）",16],[12,"图 9×16（折线／柱状／饼）",16]),R([24,"底部 18×12（透视表／表格列表）",12,"x"])]})]},
 {name:"宫格式",use:"几条平行业务线没有主次、每线一张图说清，或没有结果指标的纯图表分析：同权重等分，一眼比较。",rows:[
  R([24,"横幅 24×5",5,"t"]),R([6,"单指标",7],[6,"单指标",7],[6,"单指标",7],[6,"单指标（或多项统计）",7]),
  R([8,"图 8×16（图表／进度条／分类汇总）",16],[8,"图 8×16（同）",16],[8,"图 8×16（同）",16]),R([24,"底部 24×12（透视表／表格列表，可无）",12,"x"])]},
 {name:"页签分段式",use:"内容按阶段或业务分 3～5 段、每段有图又有表：每段自成小看板，页签一屏一段。",rows:[
  R([24,"横幅 24×5",5,"t"]),R([6,"单指标",7],[6,"单指标",7],[6,"单指标",7],[6,"单指标（或多项统计）",7]),
  {span:24,tabs:true,rows:[R([6,"筛选",3,"f"],[6,"筛选",3,"f"],[6,"筛选",3,"f"],[6,"筛选",3,"f"]),R([12,"图 12×16（折线／面积／柱状）",16],[6,"图（饼／环）",16],[6,"图（条形）",16]),R([24,"底部 24×12（透视表／表格列表）",12,"x"])]}]},
]},
{title:"工作台（3 种）",items:[
 {name:"层叠式",use:"默认：发起和处理都重。按使用频次从上往下堆：看数 → 发起 → 处理 → 查明细，动线一条直线。",rows:[
  R([24,"横幅 24×5",5,"t"]),R([6,"单指标",7],[6,"单指标",7],[6,"单指标",7],[6,"单指标（或多项统计）",7]),
  R([24,"按钮组件 24×6（4 个按钮以上独占一行；3 个以下 12 栏与单指标并排）",6,"k"]),R([8,"多项统计「待办」8×16（不参与流程：进度条／分类汇总）",16,"k"],[8,"我处理的 8×16",16,"k"],[8,"我发起的 8×16",16,"k"]),
  R([24,"底部 24（标签页／表格列表／日历）",18,"x"])]},
 {name:"页签承载式",use:"事项按阶段或业务分 3～5 段、每段各有列表：页签一屏一段，入口与待办压成一行放页签上方。",rows:[
  R([24,"横幅 24×5",5,"t"]),R([6,"多项统计「待办」6×12",12,"k"],[18,"按钮组件 18×12",12,"k"]),
  {span:24,tabs:true,rows:[R([6,"筛选",3,"f"],[6,"筛选",3,"f"],[6,"筛选",3,"f"],[6,"筛选",3,"f"]),R([24,"每页 24×16（表格列表／图表／透视表）",16,"x"])]}]},
 {name:"主从式",use:"以查自己的数据为主、发起动作不超过 2 个：数据占主栏 16，动作和待办收进右侧 8 栏侧栏。",rows:[
  R([24,"横幅 24×5",5,"t"]),
  R({span:16,rows:[R([8,"单指标",7],[8,"单指标",7],[8,"单指标（可无）",7]),R([24,"主栏 16×26（表格列表／标签页／透视表）",26,"x"])]},
    {span:8,rows:[R([24,"按钮组件 8×10",10,"k"]),R([24,"多项统计「待办」8×12",12,"k"]),R([24,"8×11（日历／进度条／分类汇总）",11,"f"])]})]},
]},
{title:"自定义详情页（2 种）",items:[
 {name:"双栏式",use:"默认。有本记录自己的数字用 13＋11，主栏字段铺开、明细压到底部页签；数字少、明细多用 16＋8，主栏一个标签页容器装字段与明细。",rows:[
  R([24,"记录功能区",4,"t"]),R([24,"页头卡片 24×10（标题＋状态标签＋关键字段）",10,"t"]),R([24,"状态条 24×3（有则放）",3,"f"]),
  R([13,"主栏 13×24（字段组／标签页容器／表格列表／透视表）",24],{span:11,rows:[R([24,"侧栏 11×16（标签页容器／数值与计算字段的字段组／单指标／进度条／图表／流程执行记录／动态／评论）",16]),R([24,"侧栏 11×7（快捷表单／单指标／进度条，可无）",7,"k"])]}),
  {span:24,tabs:true,rows:[R([24,"底部通栏 24×36～55（标签页容器／表格列表／透视表，可无）",36,"x"])]}]},
 {name:"单栏式",use:"信息量少：没有本记录自己的数字、关联记录 2 张以下。分栏会空一边，通栏一块字段组加一个标签页就够。",rows:[
  R([24,"记录功能区",4,"t"]),R([24,"页头卡片 24×10（标题＋状态标签＋关键字段）",10,"t"]),R([24,"状态条 24×3（有则放）",3,"f"]),
  R([24,"字段组 24×16（内部按分组排）",16]),
  {span:24,tabs:true,rows:[R([24,"页签 24×36～55（明细子表／流程执行记录／动态／评论）",36,"x"])]}]},
]}];
function block(b){
  if(Array.isArray(b)){const [s,t,h,c]=b;const d=document.createElement('div');d.className='b '+(c||'');d.style.gridColumn='span '+s;d.style.height=(h*H)+'px';d.textContent=t;return d;}
  const d=document.createElement('div');d.className='n';d.style.gridColumn='span '+b.span;
  if(b.tabs){const tb=document.createElement('div');tb.className='b f';tb.style.gridColumn='span 24';tb.style.height='20px';tb.textContent='页签 1 ｜ 页签 2 ｜ 页签 3';tb.style.justifyContent='flex-start';tb.style.paddingLeft='10px';d.appendChild(tb);d.style.border='1px dashed #999';d.style.padding='4px';d.style.borderRadius='4px';}
  b.rows.forEach(r=>r.forEach(x=>d.appendChild(block(x))));return d;}
const root=document.getElementById('root');
SECTIONS.forEach(sec=>{const h=document.createElement('h2');h.textContent=sec.title;root.appendChild(h);const w=document.createElement('div');w.className='wrap';root.appendChild(w);
 sec.items.forEach(it=>{const c=document.createElement('div');c.className='card';if(it.dark){c.style.background='#0f1a2e';c.style.color='#fff';}
  c.innerHTML=`<h3>${it.name}</h3><p ${it.dark?'style="color:#b9c6e0"':''}>${it.use}</p>`;const g=document.createElement('div');g.className='g';it.rows.forEach(r=>r.forEach?r.forEach(x=>g.appendChild(block(x))):g.appendChild(block(r)));c.appendChild(g);w.appendChild(c);});});
</script></body></html>
