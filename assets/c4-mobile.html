<!--
伙伴云界面示意图 · 结构 4：手机端（H5 / 企业微信内打开）

来源：2026-09-03 在 app.huoban.com 以安卓 UA、375×812 视口实测 H5 真实 DOM（工作区「库存管理」），
   所有 data-measured 数值来自计算样式。手机端是 React Native Web ＋ antd-mobile，类名无语义，
   本文件的类名是本 skill 自定义的，尺寸与层次是实测的。主色随工作区主题变（实测企业为 #6647FF）。
   企业微信/公众号会话（第三节）不是伙伴云界面，按微信端样式仿写，未实测。

本文件是架构与组件目录，不含业务示例：
1. data-architecture 表示整屏形态；data-component 表示可重复组件。
2. 组件槽位中的注释说明内容类型，不是默认文案。
3. 尺寸、颜色与状态外观由 base.css 的「手机端」一节和 skins/*.css 提供；
   除 .duo/.conn/.step 外所有类都收在 .phone 作用域内，与 PC 组件同名不冲突。
4. 手机图不套 PC 产品壳（不要 .window / 左侧导航 / 一级顶栏），手机壳本身就是画布内容。
5. 手机壳 375 宽＝真实逻辑像素，不要缩放尺寸。.stage 宽度按屏数在本图补充样式里给：单屏 520，双屏 1100；
   高度按内容实测回填。手机竖图嵌进报告时要限宽居中（约 360px），否则会被版心拉得巨大。
6. 重复块优先写宏（references/macros.md 手机端一节），宏没覆盖的才照本文件手写。
-->
